apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: db-scale-app-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: db-scale-app
  minReplicas: 1
  maxReplicas: 10   # 10 pods × 5 pool = 50 connections → safe under 200 max_connections
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30   # fast scale-up so the lab is visible quickly
      policies:
        - type: Pods
          value: 2
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 120
